spring:
  application:
    name: core-banking-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bank}
    username: ${DB_USER:core_svc}
    password: ${DB_PASSWORD:core_dev}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: core_banking

  flyway:
    # TẮT có chủ đích — xem services/auth-service/src/main/resources/application.yml
    enabled: false
    schemas: core_banking
    default-schema: core_banking
    clean-disabled: true

  # Property CHẾT: Kafka client (spring-kafka) không còn trên classpath sau
  # khi gỡ platform-libs — không có KafkaAutoConfiguration nào để bind khối
  # này. compose.yaml vẫn dựng broker nhưng không service nào kết nối. Giữ
  # lại vì đã ghi tài liệu (xem docs/KNOWN-LIMITATIONS.md, mục "Kafka client
  # không còn trên classpath"). Xử khi: thêm lại spring-boot-kafka +
  # spring-kafka vào pom.xml.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: core-banking-service
      auto-offset-reset: earliest

server:
  port: 8084

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

bank:
  info:
    description: "Sổ cái bút toán kép, tài khoản, hold, chuyển tiền, lãi và phí."
    structure-level: "A — chia theo aggregate"
    db-schema: core_banking
    error-code-prefix: ERR-CORE
    port: 8084
