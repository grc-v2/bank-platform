spring:
  application:
    name: core-banking-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bank}
    username: ${DB_USER:core_svc}
    password: ${DB_PASSWORD:core_dev}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: core_banking

  flyway:
    # TẮT có chủ đích — xem services/auth-service/src/main/resources/application.yml
    enabled: false
    schemas: core_banking
    default-schema: core_banking
    clean-disabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: core-banking-service
      auto-offset-reset: earliest

server:
  port: 8084

javalibs:
  security:
    jwt:
      secret: ${JWT_SECRET:javalibs-test-secret-key-0123456789abcdef}
    # DANH SÁCH NÀY THAY THẾ danh sách mặc định của javalibs-security, không
    # phải nối thêm — nên phải chép lại đủ 7 đường mặc định. Thiếu một dòng là
    # khoá swagger/actuator trong im lặng.
    permit-all:
      - /actuator/health
      - /actuator/health/**
      - /actuator/info
      - /error
      - /v3/api-docs/**
      - /swagger-ui/**
      - /swagger-ui.html
      # info công khai có chủ đích: chưa có luồng phát JWT, và payload chỉ là
      # metadata dev (không secret, không connection string).
      - /api/accounts/info

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

bank:
  info:
    description: "Sổ cái bút toán kép, tài khoản, hold, chuyển tiền, lãi và phí."
    structure-level: "A — chia theo aggregate"
    db-schema: core_banking
    error-code-prefix: ERR-CORE
    port: 8084
