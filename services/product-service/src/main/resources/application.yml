spring:
  application:
    name: product-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bank}
    username: ${DB_USER:product_svc}
    password: ${DB_PASSWORD:product_dev}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: product

  flyway:
    # TẮT có chủ đích — xem services/auth-service/src/main/resources/application.yml
    enabled: false
    schemas: product
    default-schema: product
    clean-disabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8083

javalibs:
  security:
    jwt:
      secret: ${JWT_SECRET}
    # DANH SÁCH NÀY THAY THẾ danh sách mặc định của javalibs-security, không
    # phải nối thêm — nên phải chép lại đủ 7 đường mặc định. Thiếu một dòng là
    # khoá swagger/actuator trong im lặng.
    permit-all:
      - /actuator/health
      - /actuator/health/**
      - /actuator/info
      - /error
      - /v3/api-docs/**
      - /swagger-ui/**
      - /swagger-ui.html
      # info công khai có chủ đích: chưa có luồng phát JWT, và payload chỉ là
      # metadata dev (không secret, không connection string).
      - /api/products/info

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

bank:
  info:
    description: "Danh mục sản phẩm: lãi suất, biểu phí, hạn mức, điều kiện mở, ánh xạ GL."
    structure-level: "B — layered gọn"
    db-schema: product
    error-code-prefix: ERR-PROD
    port: 8083
