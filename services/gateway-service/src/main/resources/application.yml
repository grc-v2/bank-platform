spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      server:
        webmvc:
          # spring-cloud-starter-gateway-server-webmvc (bản servlet) đọc route
          # ở prefix "spring.cloud.gateway.server.webmvc", KHÔNG phải
          # "spring.cloud.gateway" như bản reactive — xác minh bằng cách đọc
          # annotation @ConfigurationProperties trên class GatewayMvcProperties
          # trong spring-cloud-gateway-server-webmvc-5.0.2.jar. Khai nhầm prefix
          # khiến route không bao giờ được đăng ký (không lỗi, chỉ lặng lẽ vô
          # tác dụng), nên đây là chỗ dễ chép sai nhất khi tra tài liệu bản reactive.
          #
          # Route khai bằng cấu hình, không bằng code — thêm service mới là thêm
          # vài dòng yaml, không phải deploy lại logic.
          routes:
            - id: auth
              uri: ${AUTH_URI:http://localhost:8081}
              predicates:
                - Path=/api/auth/**
            - id: customer
              uri: ${CUSTOMER_URI:http://localhost:8082}
              predicates:
                - Path=/api/customers/**
            - id: product
              uri: ${PRODUCT_URI:http://localhost:8083}
              predicates:
                - Path=/api/products/**
            - id: core-banking
              uri: ${CORE_URI:http://localhost:8084}
              predicates:
                - Path=/api/accounts/**,/api/transfers/**
            - id: notification
              uri: ${NOTIFICATION_URI:http://localhost:8085}
              predicates:
                - Path=/api/notifications/**

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        # KHÔNG khai "gateway" ở đây. Bản webmvc của Spring Cloud Gateway KHÔNG có
        # endpoint actuator nào: cả jar spring-cloud-gateway-server-webmvc-5.0.2
        # (236 entry) không chứa một class @Endpoint/actuate nào — kiểm bằng
        # `unzip -l` trên jar trong ~/.m2. Khai một endpoint không tồn tại thì Boot
        # lặng lẽ bỏ qua, nên nó không gây lỗi; nó chỉ làm người đọc tưởng
        # /actuator/gateway/routes dùng được (nó luôn trả 404 — xem README).
        #
        # Quan trọng hơn là thứ ĐÃ THIẾU: không có metrics,prometheus thì Prometheus
        # không scrape nổi gateway. Năm service kia đều phơi đúng bốn endpoint dưới
        # đây, nên để nguyên danh sách cũ nghĩa là thành phần MỌI request đi qua lại
        # là điểm mù giám sát duy nhất của hệ thống. Giữ khớp với năm service kia.
        include: health,info,metrics,prometheus
