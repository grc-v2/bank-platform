spring:
  application:
    name: notification-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bank}
    username: ${DB_USER:noti_svc}
    password: ${DB_PASSWORD:noti_dev}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: notification

  flyway:
    # TẮT có chủ đích — xem services/auth-service/src/main/resources/application.yml
    enabled: false
    schemas: notification
    default-schema: notification
    clean-disabled: true

  # Property CHẾT: Kafka client (spring-kafka) không còn trên classpath sau
  # khi gỡ platform-libs — không có KafkaAutoConfiguration nào để bind khối
  # này. compose.yaml vẫn dựng broker nhưng không service nào kết nối. Giữ
  # lại vì đã ghi tài liệu (xem docs/KNOWN-LIMITATIONS.md, mục "Kafka client
  # không còn trên classpath"). Xử khi: thêm lại spring-boot-kafka +
  # spring-kafka vào pom.xml.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest

server:
  port: 8085

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

bank:
  info:
    description: "Nghe event và gửi thông báo qua Telegram/Email/Webhook."
    structure-level: "B — layered gọn"
    db-schema: notification
    error-code-prefix: ERR-NOTI
    port: 8085
