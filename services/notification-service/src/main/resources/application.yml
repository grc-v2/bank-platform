spring:
  application:
    name: notification-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bank}
    username: ${DB_USER:noti_svc}
    password: ${DB_PASSWORD:noti_dev}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: notification

  flyway:
    # TẮT có chủ đích — xem services/auth-service/src/main/resources/application.yml
    enabled: false
    schemas: notification
    default-schema: notification
    clean-disabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest

server:
  port: 8085

javalibs:
  security:
    jwt:
      secret: ${JWT_SECRET:javalibs-test-secret-key-0123456789abcdef}
    # DANH SÁCH NÀY THAY THẾ danh sách mặc định của javalibs-security, không
    # phải nối thêm — nên phải chép lại đủ 7 đường mặc định. Thiếu một dòng là
    # khoá swagger/actuator trong im lặng.
    permit-all:
      - /actuator/health
      - /actuator/health/**
      - /actuator/info
      - /error
      - /v3/api-docs/**
      - /swagger-ui/**
      - /swagger-ui.html
      # info công khai có chủ đích: chưa có luồng phát JWT, và payload chỉ là
      # metadata dev (không secret, không connection string).
      - /api/notifications/info

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

bank:
  info:
    description: "Nghe event và gửi thông báo qua Telegram/Email/Webhook."
    structure-level: "B — layered gọn"
    db-schema: notification
    error-code-prefix: ERR-NOTI
    port: 8085
