spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bank}
    username: ${DB_USER:auth_svc}
    password: ${DB_PASSWORD:auth_dev}

  jpa:
    hibernate:
      # Schema do docs/database/schema.sql dựng. Hibernate chỉ được KIỂM TRA,
      # không bao giờ được sinh hay sửa DDL.
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: auth

  flyway:
    # TẮT có chủ đích. Schema đã do docs/database/schema.sql dựng qua
    # docker-entrypoint-initdb.d, còn db/migration/ thì đang rỗng. Bật Flyway
    # lúc này trên một schema đã có bảng mà chưa có bảng lịch sử sẽ làm service
    # chết ngay khi khởi động.
    # Bật lên khi cắt migration đầu tiên từ schema.sql (xem khối [8] của file đó).
    enabled: false
    schemas: auth
    default-schema: auth
    clean-disabled: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8081

javalibs:
  security:
    jwt:
      secret: ${JWT_SECRET:javalibs-test-secret-key-0123456789abcdef}
    # DANH SÁCH NÀY THAY THẾ danh sách mặc định của javalibs-security, không
    # phải nối thêm — nên phải chép lại đủ 7 đường mặc định. Thiếu một dòng là
    # khoá swagger/actuator trong im lặng.
    permit-all:
      - /actuator/health
      - /actuator/health/**
      - /actuator/info
      - /error
      - /v3/api-docs/**
      - /swagger-ui/**
      - /swagger-ui.html
      # info công khai có chủ đích: chưa có luồng phát JWT, và payload chỉ là
      # metadata dev (không secret, không connection string).
      - /api/auth/info

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

bank:
  info:
    description: "Định danh và phát hành token. Không biết gì về tài khoản ngân hàng."
    structure-level: "B — layered gọn"
    db-schema: auth
    error-code-prefix: ERR-AUTH
    port: 8081
